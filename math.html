<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mathematics — CyberMath Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="track-body track-math">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M8 5v4M16 5v4"/>
            <path d="M4 15h16M8 13v4M16 13v4"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">CyberMath <span>Academy</span></div>
          <div class="brand-tag">Mathematics</div>
        </div>
      </a>
      <div class="header-stats" id="headerStats" aria-live="polite"></div>
    </div>
  </header>

  <main class="container track-main">
    <section class="track-head">
      <div class="track-head-left">
        <span class="eyebrow eyebrow--math">Mathematics</span>
        <h1>Professor Dave Explains</h1>
      </div>
      <a class="source-link" href="https://www.youtube.com/@ProfessorDaveExplains" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-19A1.5 1.5 0 0 1 1 16.5v-9A1.5 1.5 0 0 1 2.5 6h19A1.5 1.5 0 0 1 23 7.5zM9.5 9.5v5l5-2.5-5-2.5z"/></svg>
        Sumber: Professor Dave
      </a>
    </section>

    <div class="track-toolbar">
      <div class="progress-inline" id="mathRing"></div>
      <div class="progress-text">
        <div class="progress-label">Progres</div>
        <div class="progress-num" id="mathNum">0%</div>
      </div>
      <div class="toolbar-actions">
        <button class="btn-ghost" id="exportBtn">Export</button>
        <button class="btn-ghost" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </div>

    <div class="graph graph--math" id="mathGraph"></div>

    <div class="accordion" id="mathAccordion"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="footer-brand" href="index.html">← Pilih jalur</a>
      <button class="btn-ghost" id="resetBtn">Reset progres</button>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="math.js"></script>
</body>
</html>
