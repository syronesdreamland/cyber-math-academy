<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CyberMath Academy</title>
  <meta name="description" content="Structured learning tracker for Cybersecurity and Mathematics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="landing-body">
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M8 5v4M16 5v4"/>
            <path d="M4 15h16M8 13v4M16 13v4"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">CyberMath <span>Academy</span></div>
          <div class="brand-tag">Structured Learning Tracker</div>
        </div>
      </div>
    </div>
  </header>

  <main class="landing">
    <div class="container">
      <span class="eyebrow">Pilih jalur belajar Anda</span>
      <h1 class="landing-title">Mau mulai dari mana?</h1>

      <div class="landing-cards">
        <a class="landing-card landing-card--cyber" href="cyber.html">
          <div class="landing-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 L20 6 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V6 Z"/>
              <path d="M9 11 L11 13 L15 9"/>
            </svg>
          </div>
          <div class="landing-body">
            <div class="landing-label">Cybersecurity</div>
            <div class="landing-title-sm">90-Day Study Plan</div>
            <div class="landing-meta" id="landCyberMeta">…</div>
          </div>
          <div class="landing-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </a>

        <a class="landing-card landing-card--math" href="math.html">
          <div class="landing-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M8 5v4M16 5v4"/>
              <path d="M4 15h16M8 13v4M16 13v4"/>
            </svg>
          </div>
          <div class="landing-body">
            <div class="landing-label">Mathematics</div>
            <div class="landing-title-sm">Professor Dave Explains</div>
            <div class="landing-meta" id="landMathMeta">…</div>
          </div>
          <div class="landing-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </div>
        </a>
      </div>

      <p class="landing-foot">Progres tersimpan otomatis di perangkat Anda.</p>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="landing.js"></script>
</body>
</html>
